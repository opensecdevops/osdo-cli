# Manual npm release of the CLI, with provenance. Runs only from workflow_dispatch.
#
# Requirements (configured by a repository owner, not in this file):
#   - GitHub environment "npm-release" with a required reviewer.
#   - npm trusted publisher configured for this repository and this workflow file
#     (OIDC). No long-lived npm token is used.
# dry-run defaults to true; set it to false to publish for real.
name: npm release (manual)

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run only (nothing is uploaded)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g "npm@^11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Show package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --provenance --access public

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
