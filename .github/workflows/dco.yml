# Developer Certificate of Origin: every non-merge commit in a pull request
# must carry a "Signed-off-by" line matching its author.
#
# Uses the REST API directly (read-only token) instead of a third-party action:
# tim-actions/dco@master fails with "Unexpected end of JSON input" because its
# `commits` input is not supplied.
name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch pull request commits
        env:
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_dir="$RUNNER_TEMP/dco-pages"
          mkdir -p "$pages_dir"
          page=1
          while :; do
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${API_URL}/repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100&page=${page}" \
              -o "$pages_dir/page-${page}.json"
            count="$(jq 'length' "$pages_dir/page-${page}.json")"
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
            if [ "$page" -gt 3 ]; then
              echo "::error::pull request has more than 300 commits; refusing to check a partial list"
              exit 1
            fi
          done
          jq -s 'add' "$pages_dir"/page-*.json > "$RUNNER_TEMP/pr-commits.json"

      - name: Check sign-off
        env:
          COMMITS_FILE: ${{ runner.temp }}/pr-commits.json
        run: python3 -I .github/scripts/check-dco.py "$COMMITS_FILE"
